<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>seenARy</title>

    <link rel="icon" type="image/x-icon" href="./assets/favicon.png" />

    <style>
      :root {
        --scanner-width: min(78vw, 43.84dvh, 420px);
        --search-color: #f1f1f1;
        --detected-color: #66df97;
        --wiper-duration: 3.3s;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #212121;
        color: #f1f1f1;
        font-family: Helvetica, Arial, sans-serif;
      }

      #container {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }

      #scannerText {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        z-index: 10;
      }

      #textGuide {
        position: relative;
        width: var(--scanner-width);
        aspect-ratio: 297 / 420;
      }

      .label {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        width: max-content;
        max-width: 88vw;
        margin: 0;
        padding: 8px 16px;
        border-radius: 24px;
        background: rgba(12, 12, 12, 0.68);
        font-size: 15px;
        line-height: 1.45;
        text-align: center;
      }

      #topLabel {
        bottom: calc(100% + 18px);
        display: flex;
        align-items: center;
        gap: 9px;
      }

      #bottomLabel {
        top: calc(100% + 18px);
        background: rgba(200, 200, 200, 0.63);
        color: #151515;
      }

      .searchDot {
        width: 9px;
        height: 9px;
        flex-shrink: 0;
        border-radius: 50%;
        background: #d9d9d9;
        box-shadow:
          0 0 6px #d9d9d9,
          0 0 14px #d9d9d9;
        animation: pulse 1.4s ease-in-out infinite;
      }

      .detected .searchDot {
        background: var(--detected-color);
        box-shadow:
          0 0 6px var(--detected-color),
          0 0 14px var(--detected-color);
        animation: none;
      }

      .detected {
        color: var(--detected-color);
      }

      @keyframes pulse {
        50% {
          opacity: 0.45;
          transform: scale(0.85);
        }
      }

      .mindar-ui-scanning {
        z-index: 5 !important;
        pointer-events: none;
      }

      .mindar-ui-scanning .scanning {
        position: relative !important;
        width: var(--scanner-width) !important;
        height: auto !important;
        aspect-ratio: 297 / 420;
      }

      .mindar-ui-scanning .scanning .inner {
        border-color: var(--search-color) !important;
        color: var(--search-color);
        opacity: 0.1;
        border-width: 0.4px !important;
        border-radius: 1px !important;
      }

      .mindar-ui-scanning .scanning .scanline {
        position: absolute !important;
        top: 0 !important;
        bottom: 0 !important;
        left: 0;
        right: auto !important;
        width: 3.6px !important;
        height: 100% !important;
        margin: 0 !important;
        transform: none !important;
        z-index: 200;
        background: white !important;
        animation: scan var(--wiper-duration) ease-in-out infinite alternate !important;
      }

      @keyframes scan {
        to {
          left: calc(100% - 2px);
        }
      }

      #errorView {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 28px;
        background: #101010;
        z-index: 100;
      }

      .errorContent {
        width: 100%;
        max-width: 380px;
        text-align: center;
      }

      #errorTitle {
        font-size: 23px;
        line-height: 1.3;
      }

      #errorMessage {
        color: #ddd;
        font-size: 16px;
        line-height: 1.6;
      }

      #permissionHelp {
        color: #bbb;
        font-size: 14px;
        line-height: 1.6;
      }

      @media (prefers-reduced-motion: reduce) {
        .mindar-ui-scanning .scanning .scanline,
        .searchDot {
          animation: none !important;
        }
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
          "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
        }
      }
    </script>
  </head>

  <body>
    <div id="container"></div>

    <div id="scannerText" hidden>
      <div id="textGuide">
        <p id="topLabel" class="label" role="status" aria-live="polite">
          <span class="searchDot"></span>
          <span id="searchText">Searching...</span>
        </p>

        <!-- <p id="bottomLabel" class="label" hidden>Artwork Detected</p> -->
      </div>
    </div>

    <section id="errorView" role="alert" hidden>
      <div class="errorContent">
        <h1 id="errorTitle">AR Error</h1>
        <p id="errorMessage"></p>
        <p id="permissionHelp" hidden>
          Allow camera access in your browser settings, then reload.
        </p>
      </div>
    </section>

    <script type="module">
      const CONFIG = {
        target: "./seenAry_sCATter.mind",
        forward: "./assets/artwork.mp4",
        reverse: "./assets/artwork1_dummy.mp4",
        endImage: "./assets/Frame70.png",
        artworkAspect: 297 / 420,
        offset: 0.001,
        pixelRatio: 1.5,
        vibration: 35,
      };

      const $ = (selector) => document.querySelector(selector);

      const container = $("#container");
      const scanner = $("#scannerText");
      const topLabel = $("#topLabel");
      // const bottomLabel = $("#bottomLabel");
      const searchText = $("#searchText");
      const errorView = $("#errorView");

      let mindar;
      let forwardVideo;
      let reverseVideo;
      let forwardTexture;
      let reverseTexture;
      let endTexture;
      let material;

      function updateUI(detected = false) {
        scanner.hidden = false;
        topLabel.classList.toggle("detected", detected);
        searchText.textContent = detected ? "Artwork Detected" : "Searching...";
        // bottomLabel.hidden = !detected;
      }

      function showError(title, message, permission = false) {
        scanner.hidden = true;
        $(".mindar-ui-scanning")?.style.setProperty("display", "none");

        $("#errorTitle").textContent = title;
        $("#errorMessage").textContent = message;
        $("#permissionHelp").hidden = !permission;

        errorView.hidden = false;
      }

      async function createVideo(path) {
        const element = document.createElement("video");

        element.src = new URL(path, location.href).href;
        element.loop = false;
        element.muted = true;
        element.playsInline = true;
        element.preload = "auto";
        element.crossOrigin = "anonymous";

        element.setAttribute("playsinline", "");
        element.setAttribute("webkit-playsinline", "");

        await new Promise((resolve, reject) => {
          element.addEventListener("loadeddata", resolve, { once: true });

          element.addEventListener(
            "error",
            () => {
              reject(
                new Error(
                  `Video failed to load: ${element.src} (${element.error?.message || "Unknown media error"})`,
                ),
              );
            },
            { once: true },
          );

          element.load();
        });

        return element;
      }

      function setTexture(texture) {
        if (!material || !texture) return;

        material.uniforms.map.value = texture;
      }

      async function launch() {
        errorView.hidden = true;
        scanner.hidden = true;

        try {
          if (!window.isSecureContext) {
            throw new Error("HTTPS connection required for camera access.");
          }

          if (!navigator.mediaDevices?.getUserMedia) {
            throw new Error("Camera is unavailable in this browser.");
          }

          updateUI(false);

          const [THREE, { MindARThree }] = await Promise.all([
            import("three"),
            import("mindar-image-three"),
          ]);

          mindar = new MindARThree({
            container,
            imageTargetSrc: CONFIG.target,
            uiLoading: "no",
            uiScanning: "yes",
            uiError: "no",
          });

          const { renderer, scene, camera } = mindar;
          const anchor = mindar.addAnchor(0);

          renderer.setPixelRatio(
            Math.min(devicePixelRatio || 1, CONFIG.pixelRatio),
          );

          await mindar.start();

          renderer.setAnimationLoop(() => {
            renderer.render(scene, camera);
          });

          [forwardVideo, reverseVideo] = await Promise.all([
            createVideo(CONFIG.forward),
            createVideo(CONFIG.reverse),
          ]);

          forwardTexture = new THREE.VideoTexture(forwardVideo);
          reverseTexture = new THREE.VideoTexture(reverseVideo);

          [forwardTexture, reverseTexture].forEach((texture) => {
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;
            texture.generateMipmaps = false;
          });

          endTexture = await new THREE.TextureLoader().loadAsync(
            CONFIG.endImage,
          );
          endTexture.colorSpace = THREE.SRGBColorSpace;

          material = new THREE.ShaderMaterial({
            uniforms: {
              map: { value: forwardTexture },
            },
            vertexShader: `
              varying vec2 vUv;
              void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              uniform sampler2D map;
              varying vec2 vUv;

              void main() {
                vec4 color = texture2D(map, vUv);
                float luma = max(color.r, max(color.g, color.b));

                if (color.a < 0.01 || luma < 0.004) discard;

                gl_FragColor = vec4(color.rgb, color.a);

                #include <colorspace_fragment>
              }
            `,
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: false,
            toneMapped: false,
          });

          const plane = new THREE.Mesh(
            new THREE.PlaneGeometry(1, 1 / CONFIG.artworkAspect),
            material,
          );

          plane.position.z = CONFIG.offset;
          anchor.group.add(plane);

          forwardVideo.addEventListener("ended", () => {
            setTexture(endTexture);
          });

          anchor.onTargetFound = async () => {
            updateUI(true);

            try {
              navigator.vibrate?.(CONFIG.vibration);
            } catch {}

            reverseVideo.pause();
            forwardVideo.currentTime = 0;
            setTexture(forwardTexture);

            try {
              await forwardVideo.play();
            } catch (error) {
              console.error("Forward video playback failed:", error);
            }
          };

          anchor.onTargetLost = () => {
            updateUI(false);

            forwardVideo.pause();
            reverseVideo.currentTime = 0;
            setTexture(reverseTexture);

            reverseVideo.play().catch((error) => {
              console.error("Reverse video playback failed:", error);
            });
          };

          if (anchor.group.visible) {
            anchor.onTargetFound();
          }

          console.log("MindAR started successfully");
        } catch (error) {
          console.error("AR startup failed:", error);

          try {
            if (mindar) {
              mindar.renderer.setAnimationLoop(null);
              await mindar.stop();
              mindar.renderer.dispose();
            }
          } catch (cleanupError) {
            console.error("AR cleanup failed:", cleanupError);
          }

          forwardVideo?.pause();
          reverseVideo?.pause();

          const errors = {
            NotAllowedError: [
              "Camera access needed",
              "Allow camera access in your browser settings.",
              true,
            ],
            PermissionDeniedError: [
              "Camera access needed",
              "Allow camera access in your browser settings.",
              true,
            ],
            NotFoundError: [
              "Camera not found",
              "No available camera was found.",
            ],
            NotReadableError: [
              "Camera unavailable",
              "Close other applications using the camera.",
            ],
          };

          const [title, message, permission] = errors[error.name] || [
            "Couldn't start AR",
            error.message || "An unexpected AR error occurred.",
          ];

          showError(title, message, permission);
        }
      }

      launch();
    </script>
  </body>
</html>
